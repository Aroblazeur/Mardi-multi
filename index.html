<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mardi Multi</title>
<style>
:root{color-scheme:dark;--bg:#0f1318;--panel:#171d24;--panel2:#202833;--line:#303945;--txt:#f5f7fa;--muted:#a5b0bd;--accent:#5865f2;--good:#2ecc71;--bad:#ff6b6b;--steam:#1b2838;--steam2:#22384e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;background:#090d14;box-shadow:0 14px 34px rgba(0,0,0,.28)}.hero img{width:100%;display:block;aspect-ratio:5/2;object-fit:cover;object-position:center 43%}.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,12,.02) 35%,rgba(4,7,12,.9));pointer-events:none}.heroText{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:end;justify-content:space-between;gap:12px}.heroTitle{font-size:26px;font-weight:850;text-shadow:0 2px 10px #000}.heroSub{font-size:13px;color:#dde6ef;margin-top:2px;text-shadow:0 2px 8px #000}.pill{background:rgba(22,29,38,.88);border:1px solid rgba(255,255,255,.16);padding:7px 10px;border-radius:999px;font-size:13px;color:#d7e0e8;backdrop-filter:blur(4px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid #3a4654;border-radius:9px;padding:10px 11px}input{min-width:170px;flex:1}button{cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 8px}.sectionTitle h2{font-size:18px;margin:0}.sectionCount{font-size:12px;color:var(--muted)}.game{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:11px;align-items:start}.game.played{opacity:.78;background:#141a20}.gameIcon{width:52px;height:52px;border-radius:11px;overflow:hidden;background:#11161d;border:1px solid #303945;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#d9dfea}.gameIcon img{width:100%;height:100%;object-fit:contain;background:#11161d}.nameLine{display:flex;align-items:center;gap:5px;min-width:0}.nameWrap{position:relative;display:inline-block;max-width:100%}.name{font-weight:750;font-size:18px;color:#fff;text-decoration:none;line-height:1.2}.name:hover{text-decoration:underline}.infoBtn{display:none;width:23px;height:23px;min-width:23px;padding:0;border-radius:50%;font-size:12px;font-weight:800;color:#b9d8ed;background:#20364a;border-color:#34546e}.steamCard{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:50;width:390px;max-width:min(390px,86vw);overflow:hidden;border-radius:10px;background:linear-gradient(145deg,var(--steam2),var(--steam));border:1px solid #406078;box-shadow:0 16px 36px rgba(0,0,0,.58);color:#d6e5f0;text-align:left;font-weight:400}.nameWrap:hover .steamCard,.nameWrap:focus-within .steamCard,.nameWrap.open .steamCard{display:block}.steamHero{width:100%;aspect-ratio:460/215;object-fit:cover;display:block;background:#111820}.steamBody{padding:11px}.steamTitle{font-size:16px;font-weight:750;color:#fff;margin:0 0 6px}.steamDesc{font-size:12px;line-height:1.45;color:#c7d5e0;margin-bottom:9px}.steamFacts{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.steamChip{font-size:10px;padding:4px 6px;border-radius:4px;background:rgba(103,193,245,.12);color:#9ed7f5;border:1px solid rgba(103,193,245,.15)}.steamMeta{font-size:11px;line-height:1.45;color:#9fb2c4;margin-top:6px}.steamMeta b{color:#cbd9e4}.steamFooter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.1)}.steamPrice{font-weight:750;color:#c7f096;font-size:13px}.steamLink{font-size:11px;text-decoration:none;color:#fff;background:linear-gradient(90deg,#75b022,#588a1b);padding:6px 9px;border-radius:3px;white-space:nowrap}.meta,.small{color:var(--muted);font-size:12px}.noteRow{display:flex;gap:6px;align-items:center;margin-top:7px}.noteText{color:#d7dde5;font-size:13px;line-height:1.35;min-width:0;flex:1}.noteInput{min-width:0;flex:1;padding:7px 9px;font-size:13px;border-radius:8px;background:#121820}.iconBtn,.saveBtn,.playedBtn,.deleteBtn{width:31px;height:31px;min-width:31px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}.saveBtn{background:var(--accent);border-color:var(--accent);font-weight:800}.playedBtn{background:#263a2f;border-color:#3b6b4c}.playedBtn.restore{background:#2a3038;border-color:#4a5664}.deleteBtn{background:#3a2226;border-color:#6c353c}.voteBox{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.votes{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}.vote{padding:7px 9px;min-width:52px}.vote.on.want{outline:2px solid var(--good)}.vote.on.exclude{outline:2px solid var(--bad)}.actionsLine{display:flex;gap:6px;align-items:center;justify-content:flex-end}.who{font-size:11px;color:var(--muted);text-align:right;max-width:240px;line-height:1.25}.searchResults{margin-top:8px;display:grid;gap:6px}.result{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#151b22;cursor:pointer}.result img{width:64px;height:30px;object-fit:cover;border-radius:5px}.status{font-size:13px;color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:700px){.wrap{padding:10px}.hero{border-radius:14px;margin-bottom:8px}.hero img{aspect-ratio:2.15/1;object-position:center 42%}.heroText{left:12px;right:12px;bottom:10px}.heroTitle{font-size:20px}.heroSub{font-size:11px}.pill{font-size:11px;padding:5px 8px}.game{grid-template-columns:44px minmax(0,1fr) auto;gap:8px}.gameIcon{width:44px;height:44px;border-radius:9px}.name{font-size:17px}.panel{padding:9px;margin:6px 0;border-radius:12px}.meta{font-size:11px;line-height:1.25}.noteRow{margin-top:5px}.noteInput{padding:6px 8px;font-size:12px}.iconBtn,.saveBtn,.playedBtn,.deleteBtn{width:29px;height:29px;min-width:29px}.infoBtn{display:inline-flex;align-items:center;justify-content:center}.voteBox{align-items:flex-end;min-width:108px}.votes{gap:4px}.vote{padding:6px 7px;min-width:49px;font-size:13px}.who{max-width:130px;font-size:10px;white-space:normal}.nameWrap:hover .steamCard{display:none}.nameWrap.open .steamCard,.nameWrap:focus-within .steamCard{display:block}.steamCard{position:fixed;left:12px;right:12px;top:50%;transform:translateY(-50%);width:auto;max-width:none;max-height:82vh;overflow:auto}}
@media(max-width:460px){.game{grid-template-columns:42px minmax(0,1fr)}.gameIcon{width:42px;height:42px}.voteBox{grid-column:2;align-items:flex-start;margin-top:3px;min-width:0}.who{max-width:none;text-align:left}.votes,.actionsLine{justify-content:flex-start}}
</style></head><body><div class="wrap">
<section class="hero"><img id="groupBanner" alt="Visuel du groupe Mardi Multi"><div class="heroShade"></div><div class="heroText"><div><div class="heroTitle">Mardi Multi</div><div class="heroSub">Votez pour les prochains jeux coop du groupe</div></div><div class="pill" id="count">Chargement…</div></div></section>
<div class="panel"><div class="row"><input id="pseudo" placeholder="Ton pseudo"><button class="primary" id="savePseudo">Enregistrer</button><span class="status" id="pseudoStatus"></span></div></div>
<div class="panel"><div class="row"><input id="searchInput" placeholder="Ajouter un jeu (recherche Steam)…"><button id="manualAdd">Ajouter manuellement</button><select id="sort"><option value="name" selected>A → Z</option><option value="votes">Plus demandés</option><option value="recent">Ajouts récents</option></select></div><div class="searchResults" id="searchResults"></div></div>
<div class="sectionTitle"><h2>Jeux à choisir</h2><span class="sectionCount" id="activeCount"></span></div><div id="games"></div><div class="sectionTitle"><h2>Jeux déjà joués</h2><span class="sectionCount" id="playedCount"></span></div><div id="playedGames"></div></div>
<script>
const API='https://mwnhzfmayqvvlcyozrmk.supabase.co/functions/v1/mardi-multi';fetch('/mardi-multi-banner.webp').then(r=>r.text()).then(t=>document.getElementById('groupBanner').src='data:image/webp;base64,'+t.trim()).catch(()=>{});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let voterKey=localStorage.getItem('mm_voter_key');if(!voterKey){voterKey=crypto.randomUUID();localStorage.setItem('mm_voter_key',voterKey)}let pseudo=localStorage.getItem('mm_pseudo')||'';let games=[];const pseudoEl=document.getElementById('pseudo');pseudoEl.value=pseudo;const sortEl=document.getElementById('sort');const savedSort=localStorage.getItem('mm_sort');if(savedSort&&['name','votes','recent'].includes(savedSort))sortEl.value=savedSort;document.getElementById('savePseudo').onclick=()=>{pseudo=pseudoEl.value.trim();if(!pseudo)return alert('Entre un pseudo.');localStorage.setItem('mm_pseudo',pseudo);document.getElementById('pseudoStatus').textContent='Pseudo enregistré';setTimeout(()=>document.getElementById('pseudoStatus').textContent='',1500)};const initials=name=>String(name||'🎮').replace(/[^A-Za-z0-9À-ÿ ]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'🎮';async function api(path,opts){const r=await fetch(API+path,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Erreur réseau');return j}async function load(){try{games=await api('/api/games?voter_key='+encodeURIComponent(voterKey));render()}catch(e){document.getElementById('games').innerHTML='<div class="panel empty">Erreur de chargement : '+esc(e.message)+'</div>'}}
function noteHtml(g){if(g.note)return `<div class="noteRow"><div class="noteText">${esc(g.note)}</div><button class="iconBtn" data-edit-note="${g.id}" title="Modifier la description">✏️</button></div>`;return `<div class="noteRow"><input class="noteInput" data-note-input="${g.id}" placeholder="Ajouter une petite description…"><button class="saveBtn" data-save-note="${g.id}" title="Valider">✓</button></div>`}function iconHtml(g){const img=g.image_url||g.header_image_url||'';return img?`<div class="gameIcon"><img src="${esc(img)}" alt="Illustration de ${esc(g.name)}" onerror="this.parentNode.textContent='${esc(initials(g.name))}'"></div>`:`<div class="gameIcon">${esc(initials(g.name))}</div>`}function categoryChips(g){const cats=String(g.steam_categories||'').split(',').map(x=>x.trim()).filter(Boolean);const important=cats.filter(x=>/multi|coop|coopération|joueur|écran partagé|remote play/i.test(x));const rest=cats.filter(x=>!important.includes(x));return [...important,...rest].slice(0,7).map(x=>`<span class="steamChip">${esc(x)}</span>`).join('')}function steamCardHtml(g){if(!g.steam_appid)return '';const hero=g.header_image_url||g.image_url||'';const details=[];if(g.developers)details.push(`<div><b>Développeur :</b> ${esc(g.developers)}</div>`);if(g.release_date)details.push(`<div><b>Sortie :</b> ${esc(g.release_date)}</div>`);if(g.genres)details.push(`<div><b>Genres :</b> ${esc(g.genres)}</div>`);return `<span class="steamCard">${hero?`<img class="steamHero" src="${esc(hero)}" alt="">`:''}<span class="steamBody"><span class="steamTitle">${esc(g.name)}</span>${g.short_description?`<span class="steamDesc">${esc(g.short_description)}</span>`:''}${g.steam_categories?`<span class="steamFacts">${categoryChips(g)}</span>`:''}${details.length?`<span class="steamMeta">${details.join('')}</span>`:''}<span class="steamFooter"><span class="steamPrice">${esc(g.price_text||'Prix non indiqué')}</span><a class="steamLink" href="${esc(g.steam_url)}" target="_blank" rel="noopener">Voir sur Steam</a></span></span></span>`}function nameHtml(g,link){const card=steamCardHtml(g);if(!link)return `<span class="name">${esc(g.name)}</span>`;return `<span class="nameLine"><span class="nameWrap" data-info-wrap="${g.id}"><a class="name" href="${esc(link)}" target="_blank" rel="noopener">${esc(g.name)}</a>${card}</span>${g.steam_appid?`<button class="infoBtn" data-info="${g.id}" title="Infos Steam">i</button>`:''}</span>`}function sortGames(a){const mode=sortEl.value;const x=[...a];if(mode==='votes')x.sort((a,b)=>(b.want_count-b.exclude_count)-(a.want_count-a.exclude_count)||a.name.localeCompare(b.name));if(mode==='name')x.sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));if(mode==='recent')x.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return x}
function cardHtml(g,played=false){const link=g.steam_url||g.external_url||'';const whoWant=(g.want_voters||[]).join(', '),whoExclude=(g.exclude_voters||[]).join(', ');const controls=played?`<div class="actionsLine"><button class="playedBtn restore" data-played="0" data-id="${g.id}" title="Remettre dans la liste à choisir">↩</button><button class="deleteBtn" data-delete="${g.id}" title="Supprimer définitivement">🗑️</button></div>`:`<div class="votes"><button class="vote want ${g.my_vote==='want'?'on':''}" data-vote="want" data-id="${g.id}">👍 ${g.want_count}</button><button class="vote exclude ${g.my_vote==='exclude'?'on':''}" data-vote="exclude" data-id="${g.id}">🚫 ${g.exclude_count}</button><button class="playedBtn" data-played="1" data-id="${g.id}" title="Marquer comme déjà joué">✓</button><button class="deleteBtn" data-delete="${g.id}" title="Supprimer définitivement">🗑️</button></div><div class="who">${whoWant?`👍 ${esc(whoWant)}`:''}${whoWant&&whoExclude?' • ':''}${whoExclude?`🚫 ${esc(whoExclude)}`:''}</div>`;return `<div class="panel game ${played?'played':''}">${iconHtml(g)}<div><div>${nameHtml(g,link)}</div><div class="meta">${esc([g.genres,g.price_text].filter(Boolean).join(' • '))}</div>${noteHtml(g)}</div><div class="voteBox">${controls}</div></div>`}
function bind(){document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(+b.dataset.id,b.dataset.vote,b.classList.contains('on')));document.querySelectorAll('[data-played]').forEach(b=>b.onclick=()=>setPlayed(+b.dataset.id,b.dataset.played==='1'));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteGame(+b.dataset.delete));document.querySelectorAll('[data-save-note]').forEach(b=>b.onclick=()=>saveInlineNote(+b.dataset.saveNote));document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>startEditNote(+b.dataset.editNote));document.querySelectorAll('[data-note-input]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveInlineNote(+i.dataset.noteInput)}});document.querySelectorAll('[data-info]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.info;document.querySelectorAll('.nameWrap.open').forEach(w=>{if(+w.dataset.infoWrap!==id)w.classList.remove('open')});document.querySelector(`[data-info-wrap="${id}"]`)?.classList.toggle('open')})}function render(){const active=sortGames(games.filter(g=>!g.played)),played=sortGames(games.filter(g=>g.played));document.getElementById('count').textContent=`${active.length} à choisir • ${played.length} joués`;document.getElementById('activeCount').textContent=active.length+' jeux';document.getElementById('playedCount').textContent=played.length+' jeux';document.getElementById('games').innerHTML=active.length?active.map(g=>cardHtml(g,false)).join(''):'<div class="panel empty">Aucun jeu à choisir pour le moment.</div>';document.getElementById('playedGames').innerHTML=played.length?played.map(g=>cardHtml(g,true)).join(''):'<div class="panel empty">Aucun jeu marqué comme déjà joué.</div>';bind()}document.addEventListener('click',e=>{if(!e.target.closest('.steamCard')&&!e.target.closest('[data-info]'))document.querySelectorAll('.nameWrap.open').forEach(w=>w.classList.remove('open'))});
async function vote(id,v,isOn){pseudo=(localStorage.getItem('mm_pseudo')||pseudoEl.value.trim());if(!pseudo)return alert('Entre d’abord ton pseudo en haut.');try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,voter_key:voterKey,voter_name:pseudo,vote:isOn?null:v})});await load()}catch(e){alert(e.message)}}async function setPlayed(id,played){try{await api('/api/played',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,played})});await load()}catch(e){alert(e.message)}}async function deleteGame(id){const g=games.find(x=>x.id===id);if(!g)return;if(!confirm(`Supprimer définitivement « ${g.name} » ?\n\nSa description et tous ses votes seront également supprimés.`))return;try{await api('/api/delete-game',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id})});await load()}catch(e){alert(e.message)}}async function saveNote(id,note){try{await api('/api/note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,note})});await load()}catch(e){alert(e.message)}}async function saveInlineNote(id){const input=document.querySelector(`[data-note-input="${id}"]`);if(!input)return;const note=input.value.trim();if(!note)return;await saveNote(id,note)}function startEditNote(id){const g=games.find(x=>x.id===id);if(!g)return;const btn=document.querySelector(`[data-edit-note="${id}"]`);const row=btn?.closest('.noteRow');if(!row)return;row.innerHTML=`<input class="noteInput" data-note-input="${id}" value="${esc(g.note||'')}"><button class="saveBtn" data-save-note="${id}">✓</button>`;row.querySelector('[data-save-note]').onclick=()=>saveInlineNote(id);const input=row.querySelector('[data-note-input]');input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveInlineNote(id)}};input.focus();input.setSelectionRange(input.value.length,input.value.length)}sortEl.onchange=()=>{localStorage.setItem('mm_sort',sortEl.value);render()};let timer;document.getElementById('searchInput').oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){document.getElementById('searchResults').innerHTML='';return}timer=setTimeout(async()=>{try{const r=await api('/api/steam-search?q='+encodeURIComponent(q));document.getElementById('searchResults').innerHTML=r.map(x=>`<div class="result" data-appid="${x.appid}">${x.image?`<img src="${esc(x.image)}" alt="">`:''}<strong>${esc(x.name)}</strong></div>`).join('')||'<div class="status">Aucun résultat Steam — tu peux l’ajouter manuellement.</div>';document.querySelectorAll('[data-appid]').forEach(el=>el.onclick=()=>addSteam(+el.dataset.appid))}catch{document.getElementById('searchResults').innerHTML='<div class="status">Recherche Steam indisponible.</div>'}},300)};async function addSteam(appid){try{await api('/api/add-steam',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({appid,added_by:localStorage.getItem('mm_pseudo')||''})});document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';await load()}catch(e){alert(e.message)}}document.getElementById('manualAdd').onclick=async()=>{const name=prompt('Nom du jeu :',document.getElementById('searchInput').value.trim());if(!name)return;const external_url=prompt('Lien externe (facultatif) :','')||'';try{await api('/api/add-manual',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,external_url,added_by:localStorage.getItem('mm_pseudo')||''})});document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';await load()}catch(e){alert(e.message)}};load();
</script></body></html>
