<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mardi Multi</title>
<style>
:root{color-scheme:dark;--bg:#0f1318;--panel:#171d24;--panel2:#202833;--line:#303945;--txt:#f5f7fa;--muted:#a5b0bd;--accent:#5865f2;--good:#2ecc71;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.title{display:flex;gap:10px;align-items:center}.title h1{font-size:26px;margin:0}.pill{background:#232b35;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid #3a4654;border-radius:9px;padding:10px 11px}input{min-width:170px;flex:1}button{cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}
.game{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:11px;align-items:start}.gameIcon{width:52px;height:52px;border-radius:11px;overflow:hidden;background:#11161d;border:1px solid #303945;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#d9dfea;letter-spacing:.5px}.gameIcon img{width:100%;height:100%;object-fit:cover}.nameWrap{position:relative;display:inline-block;max-width:100%}.name{font-weight:750;font-size:18px;color:white;text-decoration:none;line-height:1.2}.name:hover{text-decoration:underline}.steamTip{display:none;position:absolute;left:0;top:calc(100% + 7px);z-index:30;width:min(360px,75vw);padding:10px 12px;border-radius:10px;background:#0d1117;border:1px solid #3a4654;box-shadow:0 10px 30px rgba(0,0,0,.45);color:#d7dde5;font-size:12px;line-height:1.45;font-weight:400;text-align:left}.nameWrap:hover .steamTip,.nameWrap:focus-within .steamTip{display:block}.meta,.small{color:var(--muted);font-size:12px}
.noteRow{display:flex;gap:6px;align-items:center;margin-top:7px}.noteText{color:#d7dde5;font-size:13px;line-height:1.35;min-width:0;flex:1}.noteInput{min-width:0;flex:1;padding:7px 9px;font-size:13px;border-radius:8px;background:#121820}.iconBtn{width:31px;height:31px;min-width:31px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}.saveBtn{padding:7px 10px;font-size:12px;background:var(--accent);border-color:var(--accent)}
.votes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.vote{padding:8px 9px}.vote.on.want{outline:2px solid var(--good)}.vote.on.exclude{outline:2px solid var(--bad)}.who{margin-top:5px;font-size:11px;color:var(--muted);text-align:right;max-width:220px}
.searchResults{margin-top:8px;display:grid;gap:6px}.result{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#151b22;cursor:pointer}.result img{width:64px;height:30px;object-fit:cover;border-radius:5px}.status{font-size:13px;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.wrap{padding:10px}.game{grid-template-columns:44px 1fr}.gameIcon{width:44px;height:44px;border-radius:9px}.votes{grid-column:1/-1;justify-content:flex-start}.who{text-align:left;max-width:none}.name{font-size:17px}.title h1{font-size:22px}.panel{padding:10px}.noteRow{grid-column:1/-1}.steamTip{width:min(320px,84vw)}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="title"><div style="font-size:30px">🎮</div><div><h1>Mardi Multi</h1><div class="small">Votez pour les jeux à essayer ensemble</div></div></div><div class="pill" id="count">Chargement…</div></div>
<div class="panel"><div class="row"><input id="pseudo" placeholder="Ton pseudo"><button class="primary" id="savePseudo">Enregistrer</button><span class="status" id="pseudoStatus"></span></div></div>
<div class="panel"><div class="row"><input id="searchInput" placeholder="Ajouter un jeu (recherche Steam)…"><button id="manualAdd">Ajouter manuellement</button><select id="sort"><option value="votes">Plus demandés</option><option value="name">A → Z</option><option value="recent">Ajouts récents</option></select></div><div class="searchResults" id="searchResults"></div></div>
<div id="games"></div></div>
<script>
const API='https://mwnhzfmayqvvlcyozrmk.supabase.co/functions/v1/mardi-multi';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let voterKey=localStorage.getItem('mm_voter_key');if(!voterKey){voterKey=crypto.randomUUID();localStorage.setItem('mm_voter_key',voterKey)}
let pseudo=localStorage.getItem('mm_pseudo')||'';let games=[];const pseudoEl=document.getElementById('pseudo');pseudoEl.value=pseudo;
document.getElementById('savePseudo').onclick=()=>{pseudo=pseudoEl.value.trim();if(!pseudo)return alert('Entre un pseudo.');localStorage.setItem('mm_pseudo',pseudo);document.getElementById('pseudoStatus').textContent='Pseudo enregistré';setTimeout(()=>document.getElementById('pseudoStatus').textContent='',1500)};
const initials=name=>String(name||'🎮').replace(/[^A-Za-z0-9À-ÿ ]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'🎮';
async function api(path,opts){const r=await fetch(API+path,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Erreur réseau');return j}
async function load(){try{games=await api('/api/games?voter_key='+encodeURIComponent(voterKey));render()}catch(e){document.getElementById('games').innerHTML='<div class="panel empty">Erreur de chargement : '+esc(e.message)+'</div>'}}
function noteHtml(g){if(g.note){return `<div class="noteRow"><div class="noteText">${esc(g.note)}</div><button class="iconBtn" data-edit-note="${g.id}" title="Modifier la description" aria-label="Modifier la description">✏️</button></div>`}return `<div class="noteRow"><input class="noteInput" data-note-input="${g.id}" placeholder="Ajouter une petite description…"><button class="saveBtn" data-save-note="${g.id}">Valider</button></div>`}
function iconHtml(g){const img=g.image_url||g.header_image_url||'';return img?`<div class="gameIcon"><img src="${esc(img)}" alt="Illustration de ${esc(g.name)}" onerror="this.parentNode.textContent='${esc(initials(g.name))}'"></div>`:`<div class="gameIcon">${esc(initials(g.name))}</div>`}
function nameHtml(g,link){const tip=g.short_description?`<span class="steamTip">${esc(g.short_description)}</span>`:'';return link?`<span class="nameWrap"><a class="name" href="${esc(link)}" target="_blank" rel="noopener">${esc(g.name)}</a>${tip}</span>`:`<span class="name">${esc(g.name)}</span>`}
function render(){let a=[...games];const mode=document.getElementById('sort').value;if(mode==='votes')a.sort((x,y)=>(y.want_count-y.exclude_count)-(x.want_count-x.exclude_count)||x.name.localeCompare(y.name));if(mode==='name')a.sort((x,y)=>x.name.localeCompare(y.name));if(mode==='recent')a.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));document.getElementById('count').textContent=a.length+' jeux';document.getElementById('games').innerHTML=a.map(g=>{const link=g.steam_url||g.external_url||'';const whoWant=(g.want_voters||[]).join(', '),whoExclude=(g.exclude_voters||[]).join(', ');return `<div class="panel game">${iconHtml(g)}<div><div>${nameHtml(g,link)}</div><div class="meta">${esc([g.genres,g.price_text].filter(Boolean).join(' • '))}</div>${noteHtml(g)}</div><div><div class="votes"><button class="vote want ${g.my_vote==='want'?'on':''}" data-vote="want" data-id="${g.id}">👍 ${g.want_count}</button><button class="vote exclude ${g.my_vote==='exclude'?'on':''}" data-vote="exclude" data-id="${g.id}">🚫 ${g.exclude_count}</button></div><div class="who">${whoWant?`👍 ${esc(whoWant)}<br>`:''}${whoExclude?`🚫 ${esc(whoExclude)}`:''}</div></div></div>`}).join('');document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(+b.dataset.id,b.dataset.vote,b.classList.contains('on')));document.querySelectorAll('[data-save-note]').forEach(b=>b.onclick=()=>saveInlineNote(+b.dataset.saveNote));document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>startEditNote(+b.dataset.editNote));document.querySelectorAll('[data-note-input]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveInlineNote(+i.dataset.noteInput)}})}
async function vote(id,v,isOn){pseudo=(localStorage.getItem('mm_pseudo')||pseudoEl.value.trim());if(!pseudo)return alert('Entre d’abord ton pseudo en haut.');try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,voter_key:voterKey,voter_name:pseudo,vote:isOn?null:v})});await load()}catch(e){alert(e.message)}}
async function saveNote(id,note){try{await api('/api/note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,note})});await load()}catch(e){alert(e.message)}}
async function saveInlineNote(id){const input=document.querySelector(`[data-note-input="${id}"]`);if(!input)return;const note=input.value.trim();if(!note)return;await saveNote(id,note)}
function startEditNote(id){const g=games.find(x=>x.id===id);if(!g)return;const btn=document.querySelector(`[data-edit-note="${id}"]`);const row=btn?.closest('.noteRow');if(!row)return;row.innerHTML=`<input class="noteInput" data-note-input="${id}" value="${esc(g.note||'')}"><button class="saveBtn" data-save-note="${id}">Valider</button>`;const input=row.querySelector('[data-note-input]');const save=row.querySelector('[data-save-note]');save.onclick=()=>saveInlineNote(id);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveInlineNote(id)}};input.focus();input.setSelectionRange(input.value.length,input.value.length)}
document.getElementById('sort').onchange=render;let timer;document.getElementById('searchInput').oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){document.getElementById('searchResults').innerHTML='';return}timer=setTimeout(async()=>{try{const r=await api('/api/steam-search?q='+encodeURIComponent(q));document.getElementById('searchResults').innerHTML=r.map(x=>`<div class="result" data-appid="${x.appid}">${x.image?`<img src="${esc(x.image)}" alt="">`:''}<strong>${esc(x.name)}</strong></div>`).join('')||'<div class="status">Aucun résultat Steam — tu peux l’ajouter manuellement.</div>';document.querySelectorAll('[data-appid]').forEach(el=>el.onclick=()=>addSteam(+el.dataset.appid))}catch(e){document.getElementById('searchResults').innerHTML='<div class="status">Recherche Steam indisponible.</div>'}},300)};
async function addSteam(appid){try{await api('/api/add-steam',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({appid,added_by:localStorage.getItem('mm_pseudo')||''})});document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';await load()}catch(e){alert(e.message)}}
document.getElementById('manualAdd').onclick=async()=>{const name=prompt('Nom du jeu :',document.getElementById('searchInput').value.trim());if(!name)return;const external_url=prompt('Lien externe (facultatif) :','')||'';try{await api('/api/add-manual',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,external_url,added_by:localStorage.getItem('mm_pseudo')||''})});document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';await load()}catch(e){alert(e.message)}};
load();
</script>
</body>
</html>
